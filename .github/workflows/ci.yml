name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Builds the launcher and runs the unit tests (the package's checkPhase
    # is `dune runtest`), then evaluates every flake output without building
    # the guest image. The e2e suite boots real VMs and needs KVM, so it
    # runs on a maintainer's host, not here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Build + unit tests
        run: nix build -L .#vm-launcher
      - name: Evaluate flake outputs
        run: nix flake check --no-build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: gitleaks (full history)
        run: nix run nixpkgs#gitleaks -- git --redact --verbose .
